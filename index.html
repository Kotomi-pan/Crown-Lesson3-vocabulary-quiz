    }

  });

function shuffle(array) {

  const a = [...array];

  for (
    let i = a.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      a[i],
      a[j]
    ] = [
      a[j],
      a[i]
    ];

  }

  return a;

}


/*
==================================================

==================================================
*/

function startQuiz() {

  const errorBox =
    document.getElementById("setupError");

  errorBox.classList.add("hidden");

  const nickname =
    document
      .getElementById("nickname")
      .value
      .trim();

  if (!nickname) {

    showSetupError(
      "ランキング表示名を入力してください。"
    );

    return;

  }

  if (nickname.length > 20) {

    showSetupError(
      "表示名は20文字以内にしてください。"
    );

    return;

  }

  const selectedSections =
    [
      ...document.querySelectorAll(
        ".sectionCheck:checked"
      )
    ].map(
      e => Number(e.value)
    );

  if (!selectedSections.length) {

    showSetupError(
      "Sectionを1つ以上選んでください。"
    );

    return;

  }

  const category =
    document
      .getElementById("category")
      .value;

  const direction =
    document
      .getElementById("direction")
      .value;

  const count =
    Number(
      document
        .getElementById("questionCount")
        .value
    );

  let pool =
    DATA.filter(
      item =>
        selectedSections.includes(
          item.section
        )
    );

  if (category !== "all") {

    pool =
      pool.filter(
        item =>
          item.type === category
      );

  }

  if (!pool.length) {

    showSetupError(
      "選択した条件では問題がありません。"
    );

    return;

  }

  pool = shuffle(pool);

  if (count !== 999) {

    pool =
      pool.slice(
        0,
        Math.min(
          count,
          pool.length
        )
      );

  }

  questions =
    pool.map(item => {

      let dir = direction;

      if (direction === "mixed") {

        dir =
          Math.random() < 0.5
            ? "en-ja"
            : "ja-en";

      }

      return {
        ...item,
        direction: dir
      };

    });

  currentNickname = nickname;

  localStorage.setItem(
    "lesson3Nickname",
    nickname
  );

  currentIndex = 0;

  score = 0;

  mistakes = [];

  document
    .getElementById("setup")
    .classList
    .add("hidden");

  document
    .getElementById("result")
    .classList
    .add("hidden");

  document
    .getElementById("quiz")
    .classList
    .remove("hidden");

  showQuestion();

}


function showSetupError(message) {

  const box =
    document.getElementById(
      "setupError"
    );

  box.textContent = message;

  box.classList.remove("hidden");

}


/*
==================================================
問題表示
==================================================
*/

function showQuestion() {

  locked = false;

  const q =
    questions[currentIndex];

  document
    .getElementById("status")
    .textContent =
      `${currentIndex + 1} / ${questions.length}　正解 ${score}`;

  document
    .getElementById(
      "progressBar"
    )
    .style
    .width =
      `${(currentIndex / questions.length) * 100}%`;

  document
    .getElementById(
      "sectionBadge"
    )
    .textContent =
      `Section ${q.section}`;

  document
    .getElementById(
      "typeBadge"
    )
    .textContent =
      q.type === "word"
        ? "単語"
        : "熟語";

  const feedback =
    document.getElementById(
      "feedback"
    );

  feedback.textContent = "";

  feedback.className =
    "feedback";

  document
    .getElementById(
      "nextButton"
    )
    .classList
    .add("hidden");

  const choices =
    document.getElementById(
      "choices"
    );

  const spellArea =
    document.getElementById(
      "spellArea"
    );

  choices.innerHTML = "";

  if (
    q.direction === "en-ja"
  ) {

    document
      .getElementById(
        "instruction"
      )
      .textContent =
        "次の英語の意味を選んでください。";

    document
      .getElementById(
        "question"
      )
      .textContent =
        q.en;

    choices
      .classList
      .remove("hidden");

    spellArea
      .classList
      .add("hidden");

    let candidates =
      DATA
        .filter(
          item =>
            item.ja !== q.ja
        )
        .map(
          item =>
            item.ja
        );

    candidates =
      [
        ...new Set(candidates)
      ];

    const distractors =
      shuffle(candidates)
        .slice(0, 3);

    const answerChoices =
      shuffle(
        [
          q.ja,
          ...distractors
        ]
      );

    answerChoices.forEach(
      answer => {

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "choice";

        button.textContent =
          answer;

        button.addEventListener(
          "click",
          () =>
            selectChoice(
              button,
              answer,
              q
            )
        );

        choices.appendChild(
          button
        );

      }
    );

  } else {

    document
      .getElementById(
        "instruction"
      )
      .textContent =
        "次の日本語を英語にしてください。";

    document
      .getElementById(
        "question"
      )
      .textContent =
        q.ja;

    choices
      .classList
      .add("hidden");

    spellArea
      .classList
      .remove("hidden");

    const input =
      document.getElementById(
        "spellInput"
      );

    input.value = "";

    input.disabled = false;

    setTimeout(
      () => input.focus(),
      50
    );

  }

}

4択判定
==================================================

function selectChoice(
  button,
  answer,
  q
) {

  if (locked) {
    return;
  }

  locked = true;

  const buttons =
    [
      ...document.querySelectorAll(
        ".choice"
      )
    ];

  buttons.forEach(btn => {

    btn.disabled = true;

    if (
      btn.textContent === q.ja
    ) {

      btn
        .classList
        .add("correct");

    }

  });

  if (
    answer === q.ja
  ) {

    score++;

    showFeedback(
      true,
      "正解！"
    );

  } else {

    button
      .classList
      .add("wrong");

    mistakes.push({

      ...q,

      userAnswer:
        answer

    });

    showFeedback(
      false,
      `不正解　正解：${q.ja}`
    );

  }

  document
    .getElementById(
      "nextButton"
    )
    .classList
    .remove("hidden");

}


/*
==================================================
スペル入力判定
==================================================
*/

function normalizeEnglish(str) {

  return String(str)

    .toLowerCase()

    .trim()

    .replace(
      /[～〜….,，．・]/g,
      ""
    )

    .replace(
      /[’‘]/g,
      "'"
    )

    .replace(
      /\s+/g,
      " "
    );

}


function getAcceptedAnswers(en) {

  const answers =
    new Set();

  answers.add(
    normalizeEnglish(en)
  );

  /*
  ～ や ... を除いた形も正解とする
  */

  answers.add(

    normalizeEnglish(

      en
        .replace(
          /[～〜]/g,
          ""
        )
        .replace(
          /\.\.\./g,
          ""
        )

    )

  );

  return answers;

}


function checkSpell() {

  if (locked) {
    return;
  }

  const q =
    questions[currentIndex];

  const input =
    document.getElementById(
      "spellInput"
    );

  const userAnswer =
    input.value.trim();

  if (!userAnswer) {

    alert(
      "英語を入力してください。"
    );

    return;

  }

  locked = true;

  input.disabled = true;

  const accepted =
    getAcceptedAnswers(
      q.en
    );

  const given =
    normalizeEnglish(
      userAnswer
    );

  if (
    accepted.has(given)
  ) {

    score++;

    showFeedback(
      true,
      "正解！"
    );

  } else {

    mistakes.push({

      ...q,

      userAnswer:
        userAnswer

    });

    showFeedback(
      false,
      `不正解　正解：${q.en}`
    );

  }

  document
    .getElementById(
      "nextButton"
    )
    .classList
    .remove("hidden");

}


function showFeedback(
  correct,
  text
) {

  const feedback =
    document.getElementById(
      "feedback"
    );

  feedback.textContent =
    correct
      ? "⭕ " + text
      : "❌ " + text;

  feedback.className =
    "feedback " +
    (
      correct
        ? "good"
        : "bad"
    );

}

async function finishQuiz() {

  document
    .getElementById(
      "quiz"
    )
    .classList
    .add("hidden");

  document
    .getElementById(
      "result"
    )
    .classList
    .remove("hidden");

  const total =
    questions.length;

  const wrong =
    total - score;

  const rate =
    Math.round(
      score /
      total *
      100
    );

  document
    .getElementById(
      "finalScore"
    )
    .textContent =
      `${score} / ${total}`;

  document
    .getElementById(
      "correctStat"
    )
    .textContent =
      score;

  document
    .getElementById(
      "wrongStat"
    )
    .textContent =
      wrong;

  document
    .getElementById(
      "rateStat"
    )
    .textContent =
      rate + "%";

  let message = "";

  if (rate === 100) {

    message =
      "🎉 Perfect! 全問正解です！";

  } else if (
    rate >= 80
  ) {

    message =
      "👏 Great! よくできました！";

  } else if (
    rate >= 60
  ) {

    message =
      "👍 Good! 間違えた問題を復習しましょう。";

  } else {

    message =
      "📚 間違えた問題を確認して、もう一度挑戦しましょう！";

  }

  document
    .getElementById(
      "resultMessage"
    )
    .textContent =
      message;

  showReview();

  await saveQuizResult(
    total,
    score,
    rate
  );

}

/*
==================================================
日本時間の日付範囲
==================================================
*/

function getJstDayRange() {

  const now =
    new Date();

  const formatter =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Tokyo",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"
      }
    );

  const parts =
    formatter
      .format(now)
      .split("-");

  const year =
    Number(parts[0]);

  const month =
    Number(parts[1]);

  const day =
    Number(parts[2]);

  /*
  JST 00:00 は UTC 前日15:00
  */

  const start =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day,
        -9,
        0,
        0
      )
    );

  const end =
    new Date(
      start.getTime() +
      24 * 60 * 60 * 1000
    );

  return {
    start,
    end
  };

}


function getJstWeekRange() {

  const {
    start: todayStart
  } =
    getJstDayRange();

  /*
  JSTで曜日を取得
  */

  const jstEquivalent =
    new Date(
      todayStart.getTime() +
      9 * 60 * 60 * 1000
    );

  const dayOfWeek =
    jstEquivalent
      .getUTCDay();

  /*
  月曜 = 0 として計算
  */

  const daysFromMonday =
    (
      dayOfWeek + 6
    ) % 7;

  const start =
    new Date(
      todayStart.getTime() -
      daysFromMonday *
      24 *
      60 *
      60 *
      1000
    );

  const end =
    new Date(
      start.getTime() +
      7 *
      24 *
      60 *
      60 *
      1000
    );

  return {
    start,
    end
  };

}

/*
==================================================
今日のランキング
==================================================
*/

async function loadDailyRanking() {

  const range =
    getJstDayRange();

  const q =
    query(
      collection(
        db,
        "quizResults"
      ),

      where(
        "createdAt",
        ">=",
        Timestamp.fromDate(
          range.start
        )
      ),

      where(
        "createdAt",
        "<",
        Timestamp.fromDate(
          range.end
        )
      )
    );

  const snapshot =
    await getDocs(q);

  const bestByUid =
    new Map();

  snapshot.forEach(
    doc => {

      const data =
        doc.data();

      if (
        typeof data.rate !==
        "number"
      ) {
        return;
      }

      const existing =
        bestByUid.get(
          data.uid
        );

      if (
        !existing ||
        data.rate >
        existing.rate
      ) {

        bestByUid.set(
          data.uid,
          {
            nickname:
              data.nickname ||
              "匿名",

            rate:
              data.rate,

            correct:
              data.correct || 0,

            total:
              data.total || 0
          }
        );

      } else if (
        existing &&
        data.rate ===
        existing.rate &&
        data.correct >
        existing.correct
      ) {

        bestByUid.set(
          data.uid,
          {
            nickname:
              data.nickname ||
              "匿名",

            rate:
              data.rate,

            correct:
              data.correct || 0,

            total:
              data.total || 0
          }
        );

      }

    }
  );

  const ranking =
    [
      ...bestByUid.values()
    ]
      .sort(
        (a, b) => {

          if (
            b.rate !==
            a.rate
          ) {

            return (
              b.rate -
              a.rate
            );

          }

          return (
            b.correct -
            a.correct
          );

        }
      )
      .slice(
        0,
        20
      );

  renderDailyRanking(
    ranking
  );

}


/*
==================================================
週間ランキング
==================================================
*/

async function loadWeeklyRanking() {

  const range =
    getJstWeekRange();

  const q =
    query(
      collection(
        db,
        "quizResults"
      ),

      where(
        "createdAt",
        ">=",
        Timestamp.fromDate(
          range.start
        )
      ),

      where(
        "createdAt",
        "<",
        Timestamp.fromDate(
          range.end
        )
      )
    );

  const snapshot =
    await getDocs(q);

  const totalsByUid =
    new Map();

  snapshot.forEach(
    doc => {

      const data =
        doc.data();

      const existing =
        totalsByUid.get(
          data.uid
        ) || {

          nickname:
            data.nickname ||
            "匿名",

          points:
            0,

          attempts:
            0

        };

      existing.nickname =
        data.nickname ||
        existing.nickname;

      existing.points +=
        Number(
          data.correct || 0
        );

      existing.attempts++;

      totalsByUid.set(
        data.uid,
        existing
      );

    }
  );

  const ranking =
    [
      ...totalsByUid.values()
    ]
      .sort(
        (a, b) =>
          b.points -
          a.points
      )
      .slice(
        0,
        20
      );

  renderWeeklyRanking(
    ranking
  );

}

function rankingClass(index) {

  if (index === 0) {
    return "rank1";
  }

  if (index === 1) {
    return "rank2";
  }

  if (index === 2) {
    return "rank3";
  }

}


function medal(index) {

    return "🥇";
  }

  if (index === 1) {
    return "🥈";
  }

  if (index === 2) {
    return "🥉";
  }

  return String(
    index + 1
  );

}

  .addEventListener(
    "click",
    nextQuestion
  );


document
  .getElementById(
    "restartButton"
  )
  .addEventListener(
    "click",
    restartQuiz
  );


document
  .getElementById(
    "refreshRankingButton"
  )
  .addEventListener(
    "click",
    loadRankings
  );


document
  .getElementById(
    "spellInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key !==
        "Enter"
      ) {
        return;
      }

      if (!locked) {

        checkSpell();

      } else {

        nextQuestion();

      }

    }
  );


/*
==================================================
前回の表示名
==================================================
*/

const savedNickname =
  localStorage.getItem(
    "lesson3Nickname"
  );

if (savedNickname) {

  document
    .getElementById(
      "nickname"
    )
    .value =
      savedNickname;

}


/*
==================================================
開始
==================================================
*/

initializeFirebaseUser();

</script>

</body>
</html>
